[package]
org = "fiducia-cloud"
name = "fiducia-monorepo"
version = "0.1.0"
description = "Pinned integration and GitOps superproject for Fiducia services"
license = "UNLICENSED"
keywords = ["monorepo", "git-submodules", "gitops", "fiducia"]

[package.repository]
vcs = "git"
url = "https://github.com/fiducia-cloud/fiducia-monorepo"

[install]
adapter = "none"
dir = ".vendor/.zed"

[dependencies]

[publish]
include_readme = true
tag_format = "v{version}"
exclude = [".env", ".env.*", ".external/**", ".vendor/.zed/**", "node_modules/**", "tmp/**", "*.log"]

[targets.repository]
dir = "."
name = "fiducia-monorepo-repository"

[scripts]
test = "npm test"
audit = "scripts/audit-repo-state.sh --allow-dirty"
submodules-init = "git submodule sync --recursive && git submodule update --init --recursive"
submodules-status = "git submodule status --recursive"
