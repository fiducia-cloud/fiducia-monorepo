[package]
org = "fiducia-cloud"
name = "fiducia-monorepo"
version = "0.1.0"
description = "Pinned Fiducia integration workspace with Zed packages and Git submodules"
license = "MIT"
keywords = ["coordination", "locks", "leases", "monorepo", "zed", "git-submodules"]

[package.repository]
vcs = "git"
url = "https://github.com/fiducia-cloud/fiducia-monorepo"

[dependencies]
"fiducia-cloud/fiducia-interfaces" = "^0.1.0"
"fiducia-cloud/fiducia-clients" = "^0.1.0"

[publish]
include_readme = true
tag_format = "v{version}"
exclude = [".env", ".env.*", ".vendor/.zed/**", ".zed/**", ".zed-pack/**", "apps/**", "**/*.log"]

[install]
adapter = "none"
dir = ".vendor/.zed"

[targets.repository]
dir = "."
name = "fiducia-monorepo-repository"

[scripts]
test = "python3 scripts/verify-zed-submodules.py"
