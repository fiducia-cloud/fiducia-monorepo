name: e2e

permissions:
  contents: read

# Default push/PR job runs the whole suite with NO cluster deployed. Every suite
# SKIPS when no endpoint is configured, so this job passes on a clean checkout —
# it proves the specs load, parse, and skip cleanly.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  conformance-no-cluster:
    name: conformance (no cluster — must skip cleanly)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          path: fiducia-e2e
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          repository: fiducia-cloud/fiducia-test-config
          ref: 4f8a4fa9c8115e1de69d58ec312cb3e17e05864f
          path: fiducia-test-config
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "22.17.0"
      - name: Install locked dependencies without lifecycle scripts
        working-directory: fiducia-e2e
        run: npm ci --ignore-scripts
      - name: Lint (ESM syntax check)
        working-directory: fiducia-e2e
        run: node scripts/lint.mjs
      - name: Conformance + smoke (skips with no endpoint)
        working-directory: fiducia-e2e
        run: node --test

  # ───────────────────────────────────────────────────────────────────────────
  # Real single-cluster conformance against the checked-in kind tier. This does
  # not claim cross-cluster or failure-domain assurance: the infra harness is one
  # kind cluster with four labeled zones and one load balancer on port 8090.
  # ───────────────────────────────────────────────────────────────────────────
  kind-cluster-e2e:
    name: conformance (single kind cluster)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: ${{ github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          path: fiducia-e2e
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          repository: fiducia-cloud/fiducia-test-config
          ref: 4f8a4fa9c8115e1de69d58ec312cb3e17e05864f
          path: fiducia-test-config
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "22.17.0"
      - name: Check out fiducia-infra (kind tier)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          repository: fiducia-cloud/fiducia-infra
          ref: d54f37fe56206f54c11d96668a000710bfe0d766
          path: fiducia-infra
      - name: Install locked dependencies without lifecycle scripts
        working-directory: fiducia-e2e
        run: npm ci --ignore-scripts
      - name: Bring up the kind conformance cluster
        run: |
          bash fiducia-infra/tools/kind-up.sh
          echo "FIDUCIA_E2E_BASE_URL=http://127.0.0.1:8090" >> "$GITHUB_ENV"
          echo "FIDUCIA_E2E_ALLOW_INSECURE_LOCALHOST=1" >> "$GITHUB_ENV"
      - name: Conformance
        working-directory: fiducia-e2e
        run: node --test tests/smoke.test.mjs 'tests/conformance/**/*.test.mjs'
