name: e2e

# Default push/PR job runs the whole suite with NO cluster deployed. Every suite
# SKIPS when no endpoint is configured, so this job passes on a clean checkout —
# it proves the specs load, parse, and skip cleanly.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  conformance-no-cluster:
    name: conformance (no cluster — must skip cleanly)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # @fiducia/test-config is a sibling `file:` devDependency; on this repo
      # alone that path isn't present, so `npm install` is best-effort and the
      # suite depends only on Node built-ins (node:test, global fetch).
      - name: Install (best-effort; specs need only Node built-ins)
        run: npm install || true
      - name: Lint (ESM syntax check)
        run: node scripts/lint.mjs
      - name: Conformance + smoke (skips with no endpoint)
        run: node --test

  # ───────────────────────────────────────────────────────────────────────────
  # Full cross-cluster run against kind. Manual-only (workflow_dispatch) because
  # it stands up three local Kubernetes clusters via the sibling fiducia-infra
  # kind tier. Referenced by path — fiducia-infra/kind and
  # fiducia-infra/tools/kind-up.sh are being created in parallel; this job names
  # the intended entrypoint rather than depending on its exact contents.
  # ───────────────────────────────────────────────────────────────────────────
  kind-cluster-e2e:
    name: conformance + chaos (kind multi-cluster)
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check out fiducia-infra (kind tier)
        uses: actions/checkout@v4
        with:
          repository: fiducia-cloud/fiducia-infra
          path: fiducia-infra
      # Stand up the 3-cluster kind topology (one node per cluster => RF=3,
      # 2-of-3 quorum). Intended entrypoint:
      #   fiducia-infra/tools/kind-up.sh   (creates kind/ clusters + LBs)
      - name: Bring up kind multi-cluster
        run: |
          bash fiducia-infra/tools/kind-up.sh
          # kind-up.sh is expected to print the three LB URLs; wire them here:
          echo "FIDUCIA_E2E_ENDPOINTS=http://localhost:8091,http://localhost:8092,http://localhost:8093" >> "$GITHUB_ENV"
      - name: Install
        run: npm install || true
      - name: Conformance
        run: node --test 'tests/conformance/**/*.test.mjs'
      - name: Chaos (cross-cluster quorum; non-disruptive)
        run: node --test 'tests/chaos/**/*.test.mjs'
        # To exercise the gated kill-a-cluster flow, set:
        #   FIDUCIA_E2E_ALLOW_DISRUPTIVE=1
        # and wire tests/chaos disruptCluster to fiducia-infra's kind teardown.
