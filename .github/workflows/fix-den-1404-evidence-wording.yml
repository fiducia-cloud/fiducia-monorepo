name: Fix DEN-1404 evidence wording

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/fix-den-1404-evidence-wording.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fix-den-1404-evidence-wording
  cancel-in-progress: false

jobs:
  apply:
    if: github.repository == 'fiducia-cloud/fiducia-e2e' && github.head_ref == 'agent/den-1404-slo-evidence-export'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/den-1404-slo-evidence-export
          persist-credentials: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.22.1"

      - name: Apply the exact non-credential wording correction
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path('scripts/export-managed-beta-slo-evidence.mjs')
          text = path.read_text()
          old = 'This bundle is not a contractual SLA or a go/no-go authorization.'
          new = 'This bundle is not a contractual SLA and does not approve a go/no-go decision.'
          if text.count(old) != 1:
              raise SystemExit('expected exactly one bounded wording target')
          path.write_text(text.replace(old, new, 1))
          PY
          node --check scripts/export-managed-beta-slo-evidence.mjs
          node --test tests/unit/managed-beta-slo-evidence.test.mjs
          git diff --check
          git config user.name 'ORESoftware Automation'
          git config user.email 'noreply@github.com'
          git add scripts/export-managed-beta-slo-evidence.mjs
          git commit -m 'test(DEN-1404): distinguish policy wording from credential material'

      - name: Remove the one-shot applicator and push
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/fix-den-1404-evidence-wording.yml
          git commit -m 'chore: remove one-shot evidence wording fix'
          git push origin HEAD:refs/heads/agent/den-1404-slo-evidence-export
