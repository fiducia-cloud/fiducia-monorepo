name: repository secret policy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate workflow syntax
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: .github/workflows/secret-policy.yml

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.22.1"

      - name: Install SOPS 3.13.3 and age 1.3.1 with pinned checksums
        shell: bash
        run: |
          set -euo pipefail
          install_dir="$RUNNER_TEMP/fiducia-secret-tools"
          mkdir -p "$install_dir"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "$install_dir/sops" \
            https://github.com/getsops/sops/releases/download/v3.13.3/sops-v3.13.3.linux.amd64
          echo "e5bec3346a873ae91d871550f3e698c1aad962aff462a080e40f25fde17fef6b  $install_dir/sops" \
            | sha256sum --check --strict
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "$install_dir/age.tar.gz" \
            https://github.com/FiloSottile/age/releases/download/v1.3.1/age-v1.3.1-linux-amd64.tar.gz
          echo "bdc69c09cbdd6cf8b1f333d372a1f58247b3a33146406333e30c0f26e8f51377  $install_dir/age.tar.gz" \
            | sha256sum --check --strict
          tar --extract --gzip --file "$install_dir/age.tar.gz" --directory "$install_dir" \
            --strip-components=1 age/age age/age-keygen
          chmod 0755 "$install_dir/sops" "$install_dir/age" "$install_dir/age-keygen"
          echo "$install_dir" >> "$GITHUB_PATH"

      - name: Reject tracked plaintext and private key material
        run: npm run check:secrets

      - name: Test policy denials without printing fixture values
        run: npm run test:secrets

      - name: Prove ephemeral SOPS/age plane isolation
        run: npm run test:sops
