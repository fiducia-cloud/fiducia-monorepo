name: DEN-1391 auth authority system proof

on:
  pull_request:
    paths:
      - ".github/workflows/auth-authority-system.yml"
      - "tests/system/auth-authority.test.mjs"
  push:
    branches: [main]
    paths:
      - ".github/workflows/auth-authority-system.yml"
      - "tests/system/auth-authority.test.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  auth-authority:
    name: AUTH-003 / AUTH-006 real-process proof
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out E2E suite
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: fiducia-e2e

      - name: Validate this workflow
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: fiducia-e2e/.github/workflows/auth-authority-system.yml

      - name: Check out pinned interface contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: fiducia-cloud/fiducia-interfaces
          ref: bd718cd72d72aa330534f3688f8fb1ce90c19d10
          path: fiducia-interfaces

      - name: Check out auth authority candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: fiducia-cloud/fiducia-auth.rs
          ref: agent/den-1391-auth-authority-boundaries
          path: fiducia-auth.rs

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.22.1"

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: "1.97.1"
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: fiducia-auth.rs

      - name: Parse E2E source
        run: node --check fiducia-e2e/tests/system/auth-authority.test.mjs

      - name: Format, lint, and test the auth candidate
        working-directory: fiducia-auth.rs
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked --all-targets

      - name: Build the exact auth candidate
        working-directory: fiducia-auth.rs
        run: cargo build --locked --bin fiducia-auth

      - name: Run the real-process authority proof
        env:
          FIDUCIA_E2E_AUTH_SYSTEM: "1"
          FIDUCIA_AUTH_BIN: ${{ github.workspace }}/fiducia-auth.rs/target/debug/fiducia-auth
        run: >-
          node --test --test-concurrency=1
          fiducia-e2e/tests/system/auth-authority.test.mjs
