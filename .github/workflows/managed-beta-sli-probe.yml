name: DEN-1404 managed beta SLI probe

on:
  pull_request:
    paths:
      - ".github/workflows/managed-beta-sli-probe.yml"
      - "scripts/managed-beta-sli-probe.mjs"
      - "tests/unit/managed-beta-sli-probe*.test.mjs"
  push:
    branches: [main]
    paths:
      - ".github/workflows/managed-beta-sli-probe.yml"
      - "scripts/managed-beta-sli-probe.mjs"
      - "tests/unit/managed-beta-sli-probe*.test.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-and-redaction:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate this workflow
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: .github/workflows/managed-beta-sli-probe.yml

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.22.1"

      - name: Parse the dependency-free probe and tests
        run: |
          node --check scripts/managed-beta-sli-probe.mjs
          node --check tests/unit/managed-beta-sli-probe.test.mjs
          node --check tests/unit/managed-beta-sli-probe-hardening.test.mjs

      - name: Prove cumulative counters, bounded labels, redaction, failures, state integrity, locking, and atomic output
        run: node --test tests/unit/managed-beta-sli-probe*.test.mjs
