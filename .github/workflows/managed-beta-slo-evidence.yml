name: DEN-1404 managed beta SLO evidence export

on:
  pull_request:
    paths:
      - ".github/workflows/managed-beta-slo-evidence.yml"
      - "scripts/export-managed-beta-slo-evidence.mjs"
      - "tests/unit/managed-beta-slo-evidence.test.mjs"
      - "docs/managed-beta-slo-evidence-export.md"
  push:
    branches: [main]
    paths:
      - ".github/workflows/managed-beta-slo-evidence.yml"
      - "scripts/export-managed-beta-slo-evidence.mjs"
      - "tests/unit/managed-beta-slo-evidence.test.mjs"
      - "docs/managed-beta-slo-evidence-export.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate this workflow
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: .github/workflows/managed-beta-slo-evidence.yml

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.22.1"

      - name: Parse the dependency-free exporter and tests
        run: |
          node --check scripts/export-managed-beta-slo-evidence.mjs
          node --check tests/unit/managed-beta-slo-evidence.test.mjs

      - name: Prove identity, completeness, no-data, redaction, integrity, and atomic output
        run: node --test tests/unit/managed-beta-slo-evidence.test.mjs

      - name: Audit JavaScript dependencies
        run: npm audit --audit-level=high
