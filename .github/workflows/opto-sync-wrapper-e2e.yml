name: opto-sync wrapper e2e
on:
  pull_request:
    paths: ['tests/opto-sync-wrapper/**', '.github/workflows/opto-sync-wrapper-e2e.yml']
  workflow_dispatch:
    inputs:
      live_e2e: {description: Resolve the certified package and run native plus real-browser conformance, required: true, default: false, type: boolean}
permissions: {contents: read}
concurrency: {group: '${{ github.workflow }}-${{ github.ref }}', cancel-in-progress: true}
env:
  ZED_CLI_SHA: c636fb8f6b08695c6b4fe94e2481f4d57270b2d7
  ZED_INTERFACES_SHA: dc0e0a0620b9462817950b552d3d334a184b1cb1
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: {persist-credentials: false}
      - shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,pathlib
          root=pathlib.Path('tests/opto-sync-wrapper');p=json.loads((root/'profile.json').read_text());s=(root/'product.e2e.test.mjs').read_text();assert p['schemaVersion']==1 and p['repository']==os.environ['GITHUB_REPOSITORY'];assert p['syncRepository'].endswith('-sync') and p['syncPullRequest']>0;assert p['dependency']=={'package':'opto-sync/opto-sync-clients','range':'^0.2.0'};assert p['collections'] and len(p['collections'])==len(set(p['collections']));assert {'queuedOptimistic','remoteConfirmed'}<=set(p['writeStrategies']);assert 'indexeddb' in p['persistence']['web'] and 'sqlite' in p['persistence']['mobile'];assert {'postgres','supabase'}<=set(p['persistence']['backend']);assert p['domainGuards'];required={'real-browser-indexeddb-wasm','durable-restart','optimistic-rebase-no-flicker','remote-confirmed-no-premature-view','stable-mutation-id-replay','stale-base-conflict','tombstone-no-resurrection','postgres-supabase-authority','realtime-is-wake-hint'};assert required<=set(p['requiredScenarios']);assert all(token in s for token in ('queueMutation(','protocolPushRequest(','pendingMutations(','reconcileIncoming(','indexedDB.deleteDatabase(','SYNC_STATUS.SYNCED'));assert all(v not in json.dumps(p).lower() for v in ('refs/heads/main','branch = "main"','latest'));guards=' '.join(p['domainGuards']).lower();assert 'customer' in guards and 'admin' in guards and 'separate' in guards
          PY
          node --check tests/opto-sync-wrapper/product.e2e.test.mjs
  live-e2e:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.live_e2e }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: {persist-credentials: false}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: {repository: zed-pkg/zed-cli, ref: '${{ env.ZED_CLI_SHA }}', path: .tools/zed-cli, persist-credentials: false}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: {repository: zed-pkg/zed-interfaces, ref: '${{ env.ZED_INTERFACES_SHA }}', path: .tools/zed-interfaces, persist-credentials: false}
      - run: cargo build --locked --release --manifest-path .tools/zed-cli/Cargo.toml --bin zed
      - shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/opto-sync-consumer";rm -rf "$work";mkdir -p "$work"
          cat >"$work/.zpkg.toml" <<'EOF'
          [package]
          org="opto-sync-e2e"
          name="downstream-consumer"
          version="0.0.0"
          description="Ephemeral downstream conformance consumer"
          license="MIT"
          [dependencies]
          "opto-sync/opto-sync-clients"="^0.2.0"
          [install]
          dir="zed_modules"
          EOF
          printf 'version = 1\n' >"$work/.zpkg.lock"
          (cd "$work"&&"$GITHUB_WORKSPACE/.tools/zed-cli/target/release/zed" install --install-mode copy)
          python3 - "$work/.zpkg.lock" <<'PY'
          import pathlib,re,sys,tomllib
          p=next(p for p in tomllib.loads(pathlib.Path(sys.argv[1]).read_text()).get('package',[]) if p.get('org')=='opto-sync' and p.get('name')=='opto-sync-clients');assert re.fullmatch(r'[0-9a-f]{64}',p['sha256']);assert p['size']>0 and p['vcs_tag'] and p['source'];assert re.fullmatch(r'[0-9a-f]{40}',p['vcs_commit'])
          PY
          client="$work/zed_modules/opto-sync/opto-sync-clients/clients/ts";cd "$client";npm ci;npm run build;npm run test:node;npx playwright install --with-deps chromium;OPTO_SYNC_REQUIRE_BROWSER=1 npm run test:browser;cp "$GITHUB_WORKSPACE/tests/opto-sync-wrapper/product.e2e.test.mjs" "$client/test/downstream-product.e2e.test.mjs";OPTO_SYNC_PROFILE="$GITHUB_WORKSPACE/tests/opto-sync-wrapper/profile.json" node --test test/downstream-product.e2e.test.mjs
