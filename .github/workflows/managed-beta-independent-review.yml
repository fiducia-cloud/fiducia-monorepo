name: DEN-1654 managed beta independent review candidate

on:
  pull_request:
    paths:
      - ".github/workflows/managed-beta-independent-review.yml"
      - "docs/reviews/managed-beta-framework-review-candidate-v0.1.json"
      - "docs/reviews/managed-beta-framework-review-candidate-v0.1.md"
      - "docs/production/managed-public-beta-service-contract-v0.1.md"
      - "docs/production/managed-public-beta-slos.json"
      - "docs/production/managed-public-beta-slo-derived-series.json"
      - "docs/production/external-probe-location-contract.md"
      - "docs/security/production-safety-release-gate.json"
      - "docs/operations/managed-beta-incident-runbook.md"
      - "docs/operations/managed-beta-communication-templates.md"
      - "tools/validate-managed-beta-review.mjs"
      - "tests/managed-beta-review.test.mjs"
  push:
    branches: [main]
    paths:
      - ".github/workflows/managed-beta-independent-review.yml"
      - "docs/reviews/managed-beta-framework-review-candidate-v0.1.json"
      - "docs/reviews/managed-beta-framework-review-candidate-v0.1.md"
      - "docs/production/managed-public-beta-service-contract-v0.1.md"
      - "docs/production/managed-public-beta-slos.json"
      - "docs/production/managed-public-beta-slo-derived-series.json"
      - "docs/production/external-probe-location-contract.md"
      - "docs/security/production-safety-release-gate.json"
      - "docs/operations/managed-beta-incident-runbook.md"
      - "docs/operations/managed-beta-communication-templates.md"
      - "tools/validate-managed-beta-review.mjs"
      - "tests/managed-beta-review.test.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-review-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate this workflow
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: .github/workflows/managed-beta-independent-review.yml

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.22.1"

      - name: Parse validator and tests
        run: |
          node --check tools/validate-managed-beta-review.mjs
          node --check tests/managed-beta-review.test.mjs

      - name: Run adversarial review-validator tests
        run: node --test tests/managed-beta-review.test.mjs

      - name: Validate the checked-in exact-revision review candidate
        run: node tools/validate-managed-beta-review.mjs

      - name: Prove human approval remains fail closed
        run: |
          if node tools/validate-managed-beta-review.mjs --require-approved; then
            echo "pending machine-assisted candidate unexpectedly passed the human approval gate" >&2
            exit 1
          fi
          echo "human approval gate remains closed as required"
